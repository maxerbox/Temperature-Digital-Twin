# Non-sensitive configuration - safe to commit.
# dlt reads this automatically; env vars and secrets.toml override these values.

# Persist pipeline state (schemas, load packages, traces, buffered data)
# across container restarts. Map a Docker volume to this path.
# NOTE: must be under [pipelines] section for dlt to read it.
#   env var: PIPELINES__PIPELINES_DIR
[pipelines]
pipelines_dir = "/data/dlt"

[sources.mqtt2hf]
mqtt_topic = "theengs/#"
hf_namespace = "maxerbox"
hf_dataset = "temperature-digital-twin"
flush_interval = 60
# Minimum seconds between logged messages from the same sensor.
# TheengsGateway publishes every few seconds; this drops intermediate
# messages so each sensor contributes at most one row per interval.
throttle_interval = 20
